<!DOCTYPE html>
<html>
<head>
    <title>
        Online Expense Tracker
    </title>
    <link rel="stylesheet" href="style.css">
   
</head>
<body>
    <h1>Expense Tracker</h1>
<div class="card-summary">
    <div class="card">
       <h4>Balance</h4>
       <p style="color:black;" id="Balance" >₹0.00</p> 
    </div>

    <div class="card">
        <h4>Total Income</h4> 
         <p style="color: green;" id="totalIncome">₹0.00</p> 
    </div>
    <div class="card">
        <h4>Total Expenses</h4> 
         <p style="color: red;" id="totalExpenses">₹0.00</p> 
    </div>
</div>

    <!--Add transaction-->

    <div class="whole">
    <div class="card2">
        <h3>Add Transaction</h3>
        <label for="description">Description:</label>
        <br>
        <input type="text" id="description" name="description" placeholder="e.g.Lunct at Canteen.">
        <br><br>
        <label for="amount">Amount(₹):</label>
        <br>
        <input type="number" id="amount" name="amount" placeholder="0.00">
        <br><br>
        <label for="category" >Category:</label>
        <select id="category">
            <option value="Food">Food</option>
            <option value="Transportation">Transportation</option>
            <option value="Education">Education</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Health">Health</option>
            <option value="Shopping">Shopping</option>
            <option value="Salary">Salary</option>
            <option value="Others">Others</option>
        </select>
        <h3>Type</h3>
        <button type="button" class="Income" id="income" onclick="setType('Income')">Income </button>
        <button type="button" class="Expense" id="Expense" onclick="setType('Expense')"> Expense </button>
        <br><br>
        <button type="button" id="transaction" name="transaction" onclick="show()" >Add Transaction</button>
      <p  id="result"></p>
    </div>


    <div class="card2">
       <h3>Transactions</h3> 
       <input type="text" id="search" name="search" placeholder="Search Transactions...">
       <br><br>
       <select  id="filter" onchange="renderTransactions()">
        <option value="All">All</option>
            <option value="Income">Income</option>
            <option value="Expense">Expense</option>
          <!-- <option>Education</option>
            <option>Entertainment</option>
            <option>Health</option>
            <option>Shopping</option>
            <option>Salary</option>
            <option>Others</option> --> 
        </select>
        <br><br>

       <div class="transactions-container">

    <ul id="Transactions"></ul>

    <p id="emptyMessage" style="text-align: center;">
        No transactions yet. Add one above!
    </p>

</div>
       
       
    </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
 <script src="script.js"></script>
</body>
</html>
